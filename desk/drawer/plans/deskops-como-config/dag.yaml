hierarchy:
  root:
    id: ROOT
    title: deskops como configuración sobre sldb
    owner_repo: deskops
    scope: 'deskops deja de tener motor propio: ciclo de vida, gates, vistas, escrituras y plantillas pasan a ser configuración que sldb evalúa, sirve y escribe; en código queda P4 (git, runtime, materializadores, bootstrap, identidad, CLI delgado). Cuatro paquetes: base (CC30, CC36), reglas (CC38, CC31, CC32, CC33, CC37), lecturas y escrituras (CC34, CC35), cierre (CC51, CC52, CC53). El orden lo imponen las aristas depends_on y los gates (DK5).'
    acceptance: 'Todos los hijos cerrados; G_CONSUMER satisfecho e informado a sldb; el invariante de alcance.md se cumplió en cada hijo (cada uno lo prueba en su aceptación); CHANGELOG y docs al día significa que cada hijo cumplió su propia aceptación; ROOT no agrega criterio.'
    children: [PF1, PF2, PF3, PF4]
  packages:
    - id: PF1
      title: Base - fachada limpia y plantillas como datos
      node_role: aggregate
      owner_repo: deskops
      children: [CC30, CC36]
      scope: 'Lo que no espera a ninguna capacidad nueva de reglas: operations.py como fachada sin lógica y sin specs YAML duplicados (CC30); plantillas del desk como datos escritos por el scaffold de sldb (CC36, espera a GD26).'
      acceptance: 'grep de spec/artifacts y spec/fields en deskops/ vacío; workspace.py sin strings de plantilla; deskops init en un directorio temporal produce el mismo árbol y bytes que antes.'
    - id: PF2
      title: Reglas - ciclo de vida, activación, cierre y vías de escape
      node_role: aggregate
      owner_repo: deskops
      children: [CC38, CC31, CC32, CC33, CC37]
      scope: 'Invariantes de un documento como validadores del modelo (CC38), ciclo de vida como grafo con efectos (CC31), gates de activación por tipo como RuleDoc y G_CONSUMER (CC32), cierre como regla sobre recibos de evidencia (CC33), consistencia del ciclo de vida ante cualquier escritura como validador de TaskDoc (CC37).'
      acceptance: 'task_lifecycle.yaml sin sets_status ni terminal a nivel de transición; una tarea task.code sin recibos no se activa y advance muestra el finding; el cierre no inyecta hechos en el payload; grep de closeout_evidence_verified y TASK_TYPE_EVIDENCE en deskops/ vacío.'
    - id: PF3
      title: Lecturas y escrituras vía sldb
      node_role: aggregate
      owner_repo: deskops
      children: [CC34, CC35]
      note: CC35 es agregado de CC35a-CC35d (rev 3).
      scope: 'Vistas de la UI como ViewDoc servidas por sldb (CC34); toda escritura por la transacción de sldb, con selectores y referencias entrantes de sldb (CC35).'
      acceptance: 'desk_view.py y doc_io.py no existen; deskops view board en JSON igual al golden previo; graph_ui lee /views de sldb serve.'
    - id: PF4
      title: Cierre (P5)
      node_role: aggregate
      owner_repo: deskops
      children: [CC51, CC52, CC53]
      scope: 'Medir lo que quedó como código y como configuración, verificar los 6 desks y el Board, documentar cómo se declara un tipo de tarea nuevo.'
      acceptance: 'docs/config-vs-code.md con el inventario; los 6 desks verdes; Board < 1 s caliente sobre el desk real; docs/configuration.md publicada.'
tasks:
  - id: CC30
    tree_id: T3.0
    title: Limpieza previa - operations.py como fachada y fuera los spec YAML duplicados
    kind: refactor
    node_role: delivery
    parent_id: PF1
    owner_repo: deskops
    estimate: M
    depends_on: []
    requires: [G_P0, G_GATES_FROZEN]
    enablers: {sldb: []}
    scope: '(1) Dirección única de dependencias: los helpers privados que los servicios piden a operations (tasks.py:44-78 y atoms.py:51-79: _read_doc, _write_doc, _write_new_doc, _coerce_list, _hydrate_task, _resolve_glob, _resolve_task_payload, _normalize_task_payload, _add_closeout_facts y los demás que el grep delate) pasan a un módulo deskops/doc_access.py (lectura/escritura de documentos del desk) o al servicio dueño; los servicios dejan de construir DeskopsOperations (tasks.py:35-37, atoms.py:42-44, closure.py:63-65); DeskopsOperations queda como fachada que solo delega (ningún método con más de una llamada a servicio más el armado de argumentos). Los nombres privados que graph_ui importa (ops._read_doc, _resolve_glob, _registered_repositories, _repository_root: UIs/graph_ui/frontends/mindmap/deskops_routes.py:34,41,46,67; frontends/desk/serve.py:66-75) se conservan como alias en la fachada hasta CC34 y se marcan con un comentario que nombra CC34. (2) Duplicados: _normalize_task_payload (operations.py:537-567) y compile_task_spec (specs/compiler.py:25-61) quedan en una sola función; task_lifecycle.yaml se carga solo con lifecycle.load_lifecycle_spec (workflow/next_actions.py:9 la usa en lugar de su loader propio). (3) Specs: se borran spec/artifacts/*.yaml (10) y spec/fields/*.yaml (49), specs/loader.py (SpecRegistry) y specs/mermaid.py si solo los usan tests; id_pattern, status_default y tags por artefacto pasan a un atributo de clase de cada modelo (p. ej. __artifact__) que cli/model_introspection.py lee, y _ARTIFACT_DEFAULTS (model_introspection.py:302-349) se borra; compiler.py y operations.py:1118-1123 leen ese atributo; tests/test_specs.py y test_extension_points.py:44 se adaptan a los modelos. spec/workflows/task_lifecycle.yaml se queda (CC31 lo reduce). Sin cambio de comportamiento.'
    acceptance: 'Goldens de ayuda y de salida idénticos (test_help_goldens, test_command_output_goldens sin --update-golden); grep -rn "spec/artifacts\|spec/fields\|SpecRegistry\|_ARTIFACT_DEFAULTS" deskops/ vacío; grep de "DeskopsOperations(" en deskops/services/ vacío; grep de "_normalize_task_payload\|compile_task_spec" devuelve una sola definición; los tests de los archivos tocados verdes (lista en la Validation del TaskDoc) y tests/test_desk_view.py verde incluido el cruce con graph_ui (:132); líneas de operations.py y de services/ antes y después en la Validation; CHANGELOG.'
    output_scope: deskops/operations.py, deskops/doc_access.py, deskops/services/, deskops/specs/, deskops/spec/artifacts/ (borrado), deskops/spec/fields/ (borrado), deskops/cli/model_introspection.py, deskops/models/, deskops/workflow/next_actions.py, tests/, CHANGELOG.md
  - id: CC31
    tree_id: T3.1
    title: Ciclo de vida declarado - efectos en RelationDoc.attributes y advance por edges_holding
    kind: code
    node_role: delivery
    parent_id: PF2
    owner_repo: deskops
    estimate: M
    depends_on: [CC30, CC36]
    requires: [G_GO09, G_GD26]
    enablers: {sldb: [GO09, GD26]}
    scope: 'Rehace GC04 de gates-por-tipo (DK2) sobre la API general. Los RelationDoc y RelationTypeDoc de desk/lifecycle/ se declaran como semillas managed del paquete (deskops/data/lifecycle/, mecanismo de CC36 sobre sldb scaffold_store, GD26): cada RelationDoc lleva attributes: {sets: {status: <valor>}, terminal: <bool>} según la convención de GO09; desk update --apply reescribe un RelationDoc que difiera y lo reporta (reemplaza ensure_lifecycle_graph, lifecycle.py:275-374, que hoy deja los existentes como están, :328, :354); la migración de rituales legados de lifecycle.py:204-272 y lifecycle_migration.py se conserva mientras algún desk de los 6 la necesite (lo dice desk update en dry-run) y si ninguno la necesita se borra. task_lifecycle.yaml queda solo con states (next_actions, advance_when) para el comando next; transitions sale del YAML (su contenido vive en las semillas). lifecycle.py: se borran Transition.sets_status/terminal (:40-49) y LifecycleSpec.effect (:62-66); transitions_from usa edges_holding con effects; advance toma la primera arista de edges_holding en el orden de los RelationDoc (campo order en attributes si hace falta desempatar, como clave extra que GO09 conserva), aplica apply_effects(payload, effects, modelo del tipo de la tarea) y, si terminal, current_node = complete; history la sigue escribiendo deskops. lifecycle.py queda en: cargar la configuración, llamar a sldb y escribir history; objetivo < 150 líneas. _add_closeout_facts sigue hasta CC33. La transición terminal sigue sin persistirse desde advance (la puerta de cierre es closeout commit).'
    acceptance: 'En un desk temporal, desk update --apply escribe los RelationDoc con attributes.sets.status (active, ready_for_testing, closed) y terminal true en task_completes; cambiar el sets de un RelationDoc del desk temporal (con la API de sldb en el test) hace que advance escriba ese valor sin tocar ningún YAML; un RelationDoc de la versión anterior (sin attributes) queda reescrito por desk update --apply y una segunda corrida no cambia nada; grep de sets_status y de "effect" como atributo de LifecycleSpec en deskops/ vacío; task_lifecycle.yaml sin la clave transitions; tests/test_lifecycle_graph.py y tests/test_lifecycle_end_to_end.py verdes (adaptados a effects, sin cambiar los escenarios); goldens de ayuda y salida de advance y next idénticos; deskops doctor sin hallazgos nuevos en los 6 desks tras desk update --apply en una copia de cada uno; líneas de lifecycle.py antes y después; CHANGELOG; docs/workflow-policy-reference.md.'
    output_scope: deskops/lifecycle.py, deskops/lifecycle_migration.py, deskops/spec/workflows/task_lifecycle.yaml, deskops/data/lifecycle/, deskops/services/tasks.py, deskops/workflow/next_actions.py, deskops/cli/commands/desk.py, tests/, docs/workflow-policy-reference.md, CHANGELOG.md
  - id: CC32
    tree_id: T3.2
    title: Gates de activación de cada tipo de tarea como RuleDoc (produce G_CONSUMER)
    kind: code
    node_role: delivery
    parent_id: PF2
    owner_repo: deskops
    estimate: M
    depends_on: [CC31, CC38]
    requires: [G_GO06, G_GO08, G_GATES_FROZEN]
    enablers: {sldb: [GO06, GO07, GO08]}
    scope: 'Rehace GC05 de gates-por-tipo (DK2). Por cada tipo de fábrica de GC01 (task.code, task.docs, task.debug, task.refactor, task.decision, task.aggregate, task.external; tabla normativa de gates-por-tipo brief.md §Tipos) una RuleDoc semilla managed en deskops/data/rules/ (escrita en desk/lifecycle/ por desk update --apply, DP3): subject "model <= <Clase del tipo>", where current_node = "ritual-execution", moment on_transition, severity error, condition = conjunción de any(^subject: kind = "<kind>" and anchor_state = "intact" and verdict = "accepted") por cada recibo que el tipo exige y all(depends_on: status = "closed") (DC6 de gates-por-tipo: una dependencia cerrada ya no existe y se omite del conjunto), message en español que nombra el tipo. Los chequeos entre documentos que el inventario de CC38 asigna a CC32 pasan a RuleDoc aquí y su chequeo viejo se borra en el mismo paso (DK6). task.aggregate: all(children: status = "closed") si GC09 de gates-por-tipo no existe, hipótesis en el TaskDoc (children no existe todavía como campo; la regla se escribe cuando exista y mientras tanto el tipo no tiene regla de activación de hijos). Un subtipo de desk (desk/models/*.py, DC7) suma reglas por herencia de familia sin código (DP1). Los atributos de clase __activation_receipts__ de GC01 se borran; la regla es la fuente. ReviewDoc.subject queda en __doc_anchors__ (GO07), pinneado por sldb. advance: sin arista en edges_holding, el mensaje de bloqueo lista los findings de edges_blocked (cláusula, nodo, valor visto) en lugar de las condiciones crudas; next y show los muestran también. blocked deja de ser un status guardado: es la arista bloqueada visible en show/next. Test de integración G_CONSUMER (texto del gate): desk temporal, tarea task.code sin recibos → advance falla y el mensaje nombra la cláusula any(^subject: kind = "preflight" ...); con recibos preflight y bundle de deskops review accepted e intactos → advance la activa; editar goal → los recibos quedan changed → vuelve a bloquear con anchor_state = changed. Al cerrar: deskops message send --to sldb con el hash del commit (produce G_CONSUMER).'
    acceptance: 'El test de integración G_CONSUMER pasa en sus tres pasos; una tarea task.debug exige reproduction y no bundle; una tarea task.refactor exige además goldens (herencia de familia de task.code); un subtipo task.code.cli de un desk temporal hereda las reglas de task.code sin código y una RuleDoc propia del desk suma una cláusula; una tarea con depends_on abierta no se activa y el finding nombra la dependencia; grep de __activation_receipts__ en deskops/ vacío; en una copia del desk de deskops tras desk update --apply, sldb rules check sin --subject no reporta errores (las reglas de activación son on_transition y rules check sin --subject solo recorre on_check) y sldb rules explain de la regla de task.code sobre una tarea activa existente devuelve el finding con su cláusula; goldens de ayuda idénticos; nota a sldb enviada y su archivo en sldb/desk/inbox; CHANGELOG; docs/workflow-policy-reference.md con la tabla de reglas por tipo. Produce G_CONSUMER.'
    output_scope: deskops/data/rules/, deskops/models/task_types.py, deskops/models/review.py, deskops/lifecycle.py, deskops/services/tasks.py, deskops/workflow/next_actions.py, deskops/cli/commands/desk.py, tests/, docs/workflow-policy-reference.md, desk/rituals (vía deskops), CHANGELOG.md
  - id: CC33
    tree_id: T3.3
    title: Cierre como regla sobre recibos de evidencia; en código solo los hechos de git y archivos
    kind: code
    node_role: delivery
    parent_id: PF2
    owner_repo: deskops
    estimate: L
    depends_on: [CC32, CC38]
