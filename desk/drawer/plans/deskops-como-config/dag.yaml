  - id: CC38
    title: Invariantes de documento al modelo - validadores pydantic en lugar de chequeos sueltos y tests
    kind: refactor
    node_role: delivery
    parent_id: PF2
    owner_repo: deskops
    estimate: M
    depends_on: [CC30]
    requires: []
    enablers: {sldb: []}
    scope: 'Principio del dueño (DK6): una invariante de UN documento es un validador pydantic del modelo (field_validator / model_validator), que sldb aplica en toda vía de escritura (deskops, sldb fields update, sldb docs update, /save, transacción; roundtrip en sldb api/documents/payload_save_steps.py:62); una invariante ENTRE documentos es una RuleDoc de sldb; el test solo prueba que el modelo o la regla rechaza el caso malo. (1) Inventario, en el TaskDoc, de los chequeos de un documento que hoy viven fuera del modelo o solo en tests. Puntos de partida: domain_tree.py (_check_crossroad, _check_protoatom, _check_atom), atom_tags.validate_atom_tag_namespaces, doctor._check_documents, validate_atoms, y los tests que arman un payload inválido y esperan un error del servicio (grep fijado en el TaskDoc). (2) Clasificación de cada uno: un documento → validador del modelo dueño en deskops/models/; entre documentos → RuleDoc, asignada a CC32 (activación) o CC33 (cierre y campos) en el inventario, que la implementan; lo que lea un archivo fuera del documento (p. ej. tag-namespaces.yaml) se clasifica como entre documentos. (3) Cada chequeo de un documento pasa al modelo y el chequeo viejo se borra en el mismo paso (DK3); los servicios y doctor que lo llamaban dejan de hacerlo y reportan el error de validación del modelo con el mismo texto de error que antes (goldens). (4) Tests: los que armaban un payload inválido contra el servicio pasan a probar que el modelo rechaza ese payload, y para un caso por modelo, que sldb fields update y sldb docs update lo rechazan también. No toca la consistencia del ciclo de vida de TaskDoc (status ↔ current_node ↔ history): la hace CC37 con el mismo mecanismo.'
    acceptance: 'Inventario en el TaskDoc con cada chequeo, su clasificación (modelo | RuleDoc en CC32 | RuleDoc en CC33) y su destino; cada chequeo clasificado como de un documento existe como validador en deskops/models/ y su función vieja ya no existe (grep de los nombres del inventario en deskops/ vacío salvo los asignados a CC32/CC33); por cada validador nuevo, un test que construye el modelo con el payload malo y espera ValidationError; para un modelo de atom y uno de crossroad, sldb fields update con un valor que viola el validador es rechazado en una copia del desk; deskops doctor sin hallazgos nuevos en los 6 desks y los desks existentes cargan sin errores de validación nuevos (o el TaskDoc lista los documentos inválidos encontrados y los corrige vía deskops); goldens de ayuda y salida idénticos; los tests de los archivos tocados verdes; CHANGELOG.'
    output_scope: deskops/models/, deskops/domain_tree.py, deskops/atom_tags.py, deskops/services/, deskops/cli/commands/doctor.py, tests/, CHANGELOG.md
