id: artifact.task
title: Task Artifact
type: artifact
version: "0.1"

data:
  doc:
    id_pattern: task-{slug}
    status_default: draft
    tags:
      - workspace:desk
      - artifact:task
  fields:
    - field.title
    - field.why
    - field.goal
    - field.scope
    - field.status
    - field.implementation_path
    - field.validation
    - field.done_when
    - field.current_node
    - field.history
    - field.depends_on
    - field.from_drawer
