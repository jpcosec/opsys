# KB de conocimiento permanente.
#
# Store propio, enlazado por la KB operacional. Orquestado desde spec2viz:
# los diagramas son proyecciones de estos átomos, no documentos aparte.
#
# Regla: acá no entra nada transitorio. Ningún campo de estado, ninguna
# routine, ningún gate. Lo que se acumula, no lo que avanza.

world: knowledge
version: "0.1"
store: .sldb-knowledge

models:
  # --- Raíz de dominio -----------------------------------------------------
  - name: CrossroadDoc
    ref: knowledge.models:CrossroadDoc
    doc: |
      Raíz de dominio. Padre obligatorio de todo átomo (atom-domain-crossroads-
      are-mandatory-parents). Hoy hay 21 y viven sueltos en desk/atoms/.
    fields:
      - path: str            # el eje de dominio
      - content: str

  # --- El átomo ------------------------------------------------------------
  - name: AtomDoc
    ref: knowledge.models:AtomDoc
    doc: |
      Una pregunta durable y su respuesta. 137 en disco.
      Baja a heredar de PrimitiveDoc: hoy duplica title/id/status/tags por
      fuera de la jerarquía (hallazgo 4 de la taxonomía).
    extends: PrimitiveDoc
    fields:
      - five_wh_one_plus: str
      - answer: str
      - provenance: str

  - name: ProtoAtomDoc
    ref: knowledge.models:ProtoAtomDoc
    doc: |
      Átomo libre capturado antes de tiparse. Se instancia ahora: es el
      buffer de captura que hoy no existe y obliga a improvisar.
    extends: PrimitiveDoc
    fields:
      - content: str
      - typed_as: str        # referencia al AtomDoc resultante
      - provenance: str

  - name: MaterializationContractDoc
    ref: knowledge.models:MaterializationContractDoc
    doc: De qué átomos sale cada documento humano. La trazabilidad doc→átomo.
    fields:
      - source_atoms: list[str]
      - target_kind: str
      - target_identity: str
      - intent: str
      - validation: str
      - provenance: str

relation_types:
  - name: domain_parent
    from: AtomDoc
    to: CrossroadDoc
    mode: assert
    doc: Padre de dominio obligatorio.

  - name: typed_as
    from: ProtoAtomDoc
    to: AtomDoc
    mode: assert
    doc: El protoátomo se tipó en este átomo. Deja stub de redirección.

  - name: materializes_from
    from: MaterializationContractDoc
    to: AtomDoc
    mode: assert
    doc: El documento humano se materializa desde estos átomos.

  - name: answers_within
    from: AtomDoc
    to: AtomDoc
    mode: assert
    doc: Relación entre átomos del mismo dominio.

# Sin estados. El conocimiento no transiciona.
states: []
