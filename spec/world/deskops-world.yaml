# Declaración de worlds sobre UN store sldb.
#
# Corrección: sldb es la primitiva, común a deskops y a lo que spec2viz usa.
# No hay dos stores. Hay un `.sldb` y dos worlds declarados encima, con
# modelos distintos y proyecciones distintas.
#
# La separación permanente/transitorio es de MODELOS y PROYECCIÓN, no de
# almacenamiento.

store: .sldb
version: "0.3"

# ---------------------------------------------------------------------------
# WORLD 1: conocimiento permanente. Proyección orquestada desde spec2viz.
# Sin estados: el conocimiento no transiciona.
# ---------------------------------------------------------------------------
worlds:
  - name: knowledge
    projection: knowledge
    doc: Lo durable. spec2viz proyecta estos documentos como diagramas.
    models: [CrossroadDoc, AtomDoc, ProtoAtomDoc, MaterializationContractDoc]

  - name: deskops
    projection: operational
    doc: Lo que avanza y caduca. El harness de workflow.
    models: [TaskDoc, TaskIntentDoc, AcceptanceDoc, TaskBindingDoc,
             BoardDoc, PillDoc, InboxNoteDoc, RitualDoc, StepDoc,
             PlanDoc, PlanTargetDoc, PlanIterationDoc, SymbolContractDoc,
             RunDoc, RoleDoc, RuntimeProfileDoc, RepositoryDoc, HookDoc]

  - name: code
    projection: code
    doc: |
      El código como documentos. Derivado: se reconstruye por AST y por git,
      nunca se escribe a mano. Es lo que permite que una task muestre qué
      cambió, cuándo y qué se tocó.

      NO define su propio modelo de símbolo: usa PythonSymbolDoc de sldb
      (`sldb selfdoc python-scan`), que ya captura AST + docstring + imports
      y está trackeado como documento. Medido sobre deskops: 624 símbolos
      (522 funciones, 102 clases), 75 con docstring.
    models: [PythonSymbolDoc, CommitDoc, ChangeDoc, TestCoverageDoc]

# ---------------------------------------------------------------------------
# Conocimiento permanente
# ---------------------------------------------------------------------------
models:
  - name: CrossroadDoc
    extends: PrimitiveDoc
    fields: [path, content]
    doc: Raíz de dominio. Padre obligatorio de todo átomo. 21 en disco.

  - name: AtomDoc
    extends: PrimitiveDoc        # baja a la jerarquía (hallazgo 4)
    fields: [five_wh_one_plus, answer, provenance]
    doc: 137 en disco.

  - name: ProtoAtomDoc
    extends: PrimitiveDoc
    fields: [content, typed_as, provenance]
    doc: Se instancia. Buffer de captura antes de tipar.

  - name: MaterializationContractDoc
    fields: [source_atoms, target_kind, target_identity, intent, validation, provenance]

# ---------------------------------------------------------------------------
# Trabajo: TaskDoc descompuesto
# ---------------------------------------------------------------------------
  - name: TaskDoc
    extends: OperationalArtifactDoc
    fields: [why, goal, scope, task_type, status, implementation_path,
             validation, done_when]
    doc: |
      El archivo de task (`desk/tasks/task-x.md`) materializa el task completo
      EN UN SOLO DOCUMENTO: núcleo + intent + acceptance inline, con las
      secciones `## Implementation Path`, `## Validation` y `## Done When`.

      Decisión (F4, 2026-09-20): `contains:` sigue declarado y los modelos
      TaskIntentDoc/AcceptanceDoc/TaskBindingDoc/PlanDoc quedan para cuando el
      contenido se materializa APARTE (un archivo por documento). El caso
      común —una task, un archivo— no puede cumplir `contains:` sin partir el
      archivo, y la evidencia manda: los 34 archivos de `desk/tasks/` y los
      tests de CLI leen y escriben cuerpo y campos en un solo archivo.
      Consecuencia: `implementation_path`, `validation` y `done_when` están
      declarados en TaskDoc y también en los modelos que los contienen.
    contains:
      intent: [TaskIntentDoc]
      acceptance: [AcceptanceDoc]
      binding: [TaskBindingDoc]
      plan: [PlanDoc]

  - name: TaskIntentDoc
    fields: [implementation_path, files, out_of_scope]

  - name: AcceptanceDoc
    fields: [validation, done_when, evidence]

  - name: TaskBindingDoc
    fields: [rationale]

  - name: BoardDoc
    extends: OperationalArtifactDoc
    fields: [scope, purpose, notes]
    contains: {tasks: [TaskDoc], pills: [PillDoc], rituals: [RitualDoc]}

  - name: PillDoc
    extends: OperationalArtifactDoc
    fields: [what, why, when, where, how, how_not]

  - name: InboxNoteDoc
    fields: [kind, sender_project, target_project, created_at,
             acknowledged_by, acknowledged_at, body]

  - name: RitualDoc
    extends: OperationalArtifactDoc
    fields: [purpose, trigger, preconditions, validation, failure_modes, completion]
    contains: {steps: [StepDoc]}

  - name: StepDoc
    fields: [action, outcome]

# ---------------------------------------------------------------------------
# PLANIFICACIÓN (nuevo)
#
# Hoy vive en runs/planning/*.md: 10 planes en Markdown sin modelar, escritos
# por un planificador y leídos por nadie salvo un humano. Modelarlos es lo que
# permite que la rutina itere.
# ---------------------------------------------------------------------------
  - name: PlanDoc
    extends: OperationalArtifactDoc
    doc: |
      Lo que un agente planificador produce cuando el supervisor lo suelta.
      Reemplaza runs/planning/*.md.
    fields:
      - goal: str
      - context_findings: str      # qué ya existe (la sección más útil hoy)
      - interpretation: str        # por qué se lee así la task
      - risks: str
      - ambiguities: list[str]     # lo que NO se decide solo
    contains:
      targets: [PlanTargetDoc]
      iterations: [PlanIterationDoc]

  - name: PlanTargetDoc
    doc: |
      Una cosa que hay que tocar. El puente con el AST: `symbol` apunta a un
      PythonSymbolDoc, y de ahí sale solo qué revisar y qué tests correr.

      Todo target con change_kind add|modify DEBE contener un
      SymbolContractDoc antes de que la task entre a `execution`.
    fields:
      - surface: str          # archivo o superficie
      - symbol: str           # ref a PythonSymbolDoc — el enganche con el AST
      - change_kind: str      # add | modify | delete | verify
      - rationale: str
      - acceptance: str
    contains:
      contract: [SymbolContractDoc]

  - name: SymbolContractDoc
    doc: |
      El contrato de un símbolo, escrito ANTES de implementarlo.

      Invierte el flujo: hoy docstring, lint y test son residuo de la
      implementación; acá son su entrada. El planificador los declara, el
      gate los exige, el ejecutor implementa contra ellos.

      `docstring` no tiene excusa para faltar: si el planificador no puede
      escribir qué hace el símbolo, no entendió el cambio y la task vuelve
      a planning. Medición actual en deskops: 75/624 símbolos documentados
      (12%). El contrato es el mecanismo para que eso no vuelva a pasar.

      Se materializa en dos lugares: el docstring real del código, y los
      campos autorales `purpose`/`architecture` de PythonSymbolDoc (que
      sldb inicializa en "Not documented.").
    fields:
      - qualname: str         # a qué símbolo le pone contrato
      - kind: str             # module | class | function | method
      - signature: str        # firma esperada, antes de existir
      - docstring: str        # OBLIGATORIO. Qué hace y por qué existe.
      - purpose: str          # campo autoral de PythonSymbolDoc
      - architecture: str     # campo autoral de PythonSymbolDoc
      - invariants: list[str] # qué debe seguir siendo cierto
      - lint_rules: list[str] # reglas que aplican (complejidad, largo)
      - test_plan: list[str]  # qué casos prueba, antes de escribirlos
      - test_qualname: str    # dónde va a vivir el test

  - name: PlanIterationDoc
    doc: |
      Una vuelta de la rutina. Esto es lo que hace iterable el plan: cada
      pasada del supervisor deja qué se intentó, qué se aprendió y qué
      cambió del plan.
    fields:
      - round: int
      - trigger: str          # qué gatilló la vuelta
      - findings: str
      - plan_delta: str       # qué cambió respecto de la vuelta anterior
      - outcome: str

# ---------------------------------------------------------------------------
# CÓDIGO: AST y git (nuevo)
#
# Derivado, nunca escrito a mano. Hoy extract_sources.py solo lista archivos
# (.py como nodo); no hay símbolos ni llamadas. Sin esto, "qué revisar y qué
# testear" es adivinanza.
# ---------------------------------------------------------------------------
  # PythonSymbolDoc NO se declara acá: es de sldb (sldb.models:PythonSymbolDoc).
  # Se registra en el store y se puebla con:
  #   sldb selfdoc python-sync --source-root deskops --package deskops
  #
  # Campos que ya trae: id, system, module, qualname, kind, source_path,
  # source_span, source_sha256, signature, docstring, imports, y dos campos
  # AUTORALES que deskops debe llenar: purpose y architecture.
  #
  # `sldb explore --source docstrings` ya da búsqueda sobre ellos: es la
  # entrada del planificador para encontrar qué tocar.

  - name: CommitDoc
    doc: Derivado de git. Permite ver desde la task qué cambió y cuándo.
    fields:
      - sha: str
      - author: str
      - committed_at: str
      - message: str
      - trailers: dict

  - name: ChangeDoc
    doc: |
      Un hunk. Es la unión de git y AST: el rango de líneas se resuelve a
      símbolo, y por eso la task puede decir qué función se tocó.
    fields:
      - path: str
      - line_start: int
      - line_end: int
      - added: int
      - removed: int
      - symbol: str           # ref a PythonSymbolDoc, resuelto por source_span

  - name: TestCoverageDoc
    doc: |
      Qué test ejercita qué símbolo. Da el set mínimo de tests a correr.

      Se deriva SIN ejecutar nada: `sldb selfdoc python-scan --source-root
      tests` da 350 símbolos de test con sus imports declarados, y esos
      imports ya apuntan al código (medido: deskops.cli.main 235 veces,
      deskops.operations 55, deskops.workspace 99).
      Precisión a nivel módulo hoy; a nivel símbolo cuando exista el grafo
      de llamadas (ver gap más abajo).
    fields:
      - test_qualname: str
      - covers_symbol: str
      - granularity: str      # module | symbol
      - source: str           # import_decl | pytest_trace | manual

# ---------------------------------------------------------------------------
# EJECUCIÓN
# ---------------------------------------------------------------------------
  - name: RunDoc
    doc: |
      Rellenable por el EJECUTOR, no por deskops. Hoy el ejecutor deja
      runs/subagents/<ts>/{run.yaml,result-summary.md,validation.log} y
      deskops los lee después. El modelo debe calzar con eso: el ejecutor
      escribe, deskops valida.
    fields:
      - kind: str
      - run_dir: str
      - herdr_pane_id: str
      - session_path: str
      - session_sha256: str
      - started_at: str
      - ended_at: str
      - outcome: str          # in_progress | success | failure | aborted
      - commit_sha: str
      - move_id: str          # MoveDoc del ledger de pron
      - result_summary: str   # lo que hoy es result-summary.md
      - validation_log: str   # lo que hoy es validation.log

  - name: RoleDoc
    fields: [name, description, kind, model, fallback_models, tools,
             system_prompt_mode, inherit_project_context, inherit_skills,
             default_context, body]

  - name: RuntimeProfileDoc
    extends: PrimitiveDoc
    fields: [kind, binary, model_flag, fallback_models_flag, tools_flag,
             system_prompt_flag, system_prompt_delivery, session_flag,
             extra_args, unsupported_role_fields, notes]

  - name: RepositoryDoc
    fields: [name, path, description]

  - name: HookDoc
    extends: PrimitiveDoc
    fields: [event, target, condition]
    doc: Se queda en deskops. Si se estabiliza, la primitiva va a pron.

# ---------------------------------------------------------------------------
# DESAPARECEN (absorbidos por pron)
#   ConditionDoc -> predicado sldb "{implementation_path} != ''"
#   OperatorDoc  -> cambiar el campo ya es el efecto
#   EdgeDoc      -> RelationDoc (arista dirigida del grafo)
#   ChecklistDoc -> predicado compuesto sobre el grafo
#   RoutineDoc   -> RitualDoc (procedimiento) + aristas has_step/next_step
#   current_node, history -> MoveDoc del ledger
#   State/máquina lineal -> status derivado del grafo (ver derived_status)
# ---------------------------------------------------------------------------

relation_types:
  # Workflow
  - {name: has_step, from: RitualDoc, to: StepDoc, mode: assert}
  - {name: next_step, from: StepDoc, to: StepDoc, mode: assert}
  - {name: binds, from: TaskBindingDoc, to: PillDoc, mode: assert}
  - {name: depends_on, from: TaskDoc, to: TaskDoc, mode: assert}
  - {name: blocks, from: TaskDoc, to: TaskDoc, mode: read}

  # Conocimiento (cruzan de world, mismo store)
  - {name: domain_parent, from: AtomDoc, to: CrossroadDoc, mode: assert}
  - {name: typed_as, from: ProtoAtomDoc, to: AtomDoc, mode: assert}
  - {name: references, from: TaskBindingDoc, to: AtomDoc, mode: assert}
  - {name: graduates_to, from: PillDoc, to: AtomDoc, mode: assert}

  # Planificación → código
  - {name: plans_change, from: PlanTargetDoc, to: PythonSymbolDoc, mode: assert}
  - {name: iterates, from: PlanIterationDoc, to: PlanDoc, mode: assert}
  - {name: contracts, from: SymbolContractDoc, to: PythonSymbolDoc, mode: assert,
     doc: "El contrato declarado antes de que el símbolo exista. Tras implementar, sldb selfdoc python-check compara."}
  - {name: verifies, from: SymbolContractDoc, to: TestCoverageDoc, mode: assert,
     doc: "El test declarado en el contrato, una vez escrito."}

  # AST (sobre PythonSymbolDoc de sldb)
  - {name: imports, from: PythonSymbolDoc, to: PythonSymbolDoc, mode: assert}
  - {name: defines, from: PythonSymbolDoc, to: PythonSymbolDoc, mode: assert}
  - {name: covers, from: TestCoverageDoc, to: PythonSymbolDoc, mode: assert}
  # `calls` NO se declara todavía: sldb documenta explícitamente que no
  # resuelve imports ni establece dependencias de runtime. Ver GAP.
  - {name: documents, from: AtomDoc, to: PythonSymbolDoc, mode: assert,
     doc: "Un átomo puede explicar un símbolo. Une la KB permanente con el código."}

  # git
  - {name: touches, from: ChangeDoc, to: PythonSymbolDoc, mode: assert}
  - {name: contains_change, from: CommitDoc, to: ChangeDoc, mode: assert}
  - {name: produced_commit, from: RunDoc, to: CommitDoc, mode: assert}
  - {name: evidences, from: RunDoc, to: TaskDoc, mode: assert}
  - {name: executed_by, from: RunDoc, to: RoleDoc, mode: assert}
  - {name: runs_on, from: RoleDoc, to: RuntimeProfileDoc, mode: assert}

# ---------------------------------------------------------------------------
# El status de una task NO es una máquina lineal. Es una proyección derivada
# de la posición de la task en el grafo: se calcula con predicados sobre sus
# aristas y los documentos conectados, nunca avanzando de un estado al
# siguiente. `status` queda como campo plano de TaskDoc; aquí se declara qué
# significa cada valor y con qué predicado se deriva.
#
# Los peldaños son ACUMULATIVOS: cada uno implica el anterior, y el status
# derivado es el peldaño más profundo cuyo predicado se cumple. Sin esto la
# escalera no cierra: `execution` es la negación literal de `planning`, así
# que se cumpliría apenas falla `planning` y ningún peldaño posterior sería
# alcanzable. Implementación: deskops/derived_status.py.
# ---------------------------------------------------------------------------
derived_status:
  model: TaskDoc
  field: status
  values:
    drawer: "sin board que lo rutee (sin arista BoardDoc.tasks -> TaskDoc)"
    active: "ruteado por un BoardDoc (arista BoardDoc.tasks -> TaskDoc)"
    planning: "tiene PlanDoc con targets sin contrato: {plan_targets_without_contract} > 0"
    execution: "todo target con change_kind add|modify tiene contrato: {plan_targets_without_contract} == 0"
    testing: "todo contrato implementado: {contracts_implemented} == {contracts_declared}"
    closeout: "tests de contrato pasando: {tests_from_contracts_passing} == true"
    closed: "evidencia y done_when presentes: {evidence} != '' and {done_when} != ''"

# Predicados derivados del grafo (T3.3). Cada uno se calcula recorriendo
# aristas y comparando campos de documentos conectados; no hay transiciones.
# Implementación: deskops/derived_conditions.py.
derived_conditions:
  - name: plan_targets_without_contract
    doc: |
      PlanTargetDoc con change_kind add|modify sin arista `contracts` hacia
      un SymbolContractDoc con docstring no vacío, test_plan no vacío y
      lint_rules declaradas. Si el planificador no puede escribir qué hace el
      símbolo, no entendió el cambio.
  - name: contracts_declared
    doc: "Número de SymbolContractDoc declarados para la task."
  - name: contracts_implemented
    doc: "SymbolContractDoc cuyo PythonSymbolDoc real tiene docstring (o purpose/architecture) que calza con el contrato."
  - name: tests_from_contracts_passing
    doc: "Los TestCoverageDoc/verifies derivados de los contratos, con sus tests pasando."

# ---------------------------------------------------------------------------
# GAP contra sldb (para el gap-log)
#
# `sldb selfdoc` documenta explícitamente: "The record does not resolve
# imports or establish runtime dependencies".
#
# Consecuencia práctica:
#   - "qué tests correr" sale a nivel MÓDULO (por imports declarados), no de
#     símbolo. Suficiente para empezar; impreciso en módulos grandes como
#     operations.py (2.765 líneas, 55 imports desde tests).
#   - "qué código revisar" no tiene cierre transitivo real sin grafo de
#     llamadas.
#
# Propuesta a sldb: emitir aristas `calls` en el scan (ast.Call resuelto
# contra los imports del módulo). Es el mismo AST que ya recorre.
# Mientras tanto: granularidad de módulo, declarada en TestCoverageDoc.
#
# Cobertura de docstrings medida en deskops: 75/624 (12%). Los campos
# autorales `purpose` y `architecture` de PythonSymbolDoc son el lugar
# donde eso se completa, y `sldb selfdoc python-check` reporta la deriva.
# ---------------------------------------------------------------------------
