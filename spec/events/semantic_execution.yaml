id: event.semantic_execution
version: "0.1"
purpose: Delegate semantic work to an external adapter without making the adapter authoritative for deskops workflow state.
owner: deskops
boundary:
  orchestrator:
    - deskops owns task state, validation, transitions, and closeout.
    - sldb owns structured document integrity and modeled document writes.
  adapter:
    - External adapters consume request events and return completion events.
    - Adapters may coordinate Band.ai or another execution platform.
    - Adapter output is advisory until deskops validates it locally.
events:
  semantic_execution.requested:
    description: Emitted when deskops needs semantic work for a task or phase.
    required_fields:
      - event_id
      - event_type
      - task_id
      - phase
      - capability
      - context_commands
      - allowed_mutations
      - workspace_policy
      - idempotency_key
    fields:
      event_id:
        type: string
        description: Unique event instance identifier.
      event_type:
        type: string
        const: semantic_execution.requested
      task_id:
        type: string
        description: Deskops task identifier.
      phase:
        type: string
        enum:
          - ambiguity_review
          - execution
          - testing
          - closeout
          - failure_triage
      capability:
        type: string
        enum:
          - ambiguity_review
          - code_edit
          - docs_edit
          - test_edit
          - failure_triage
          - design_review
      context_commands:
        type: list[string]
        description: Read commands the worker should use to load context.
        examples:
          - deskops show task task-042 --json
          - deskops next task-042 --json
      allowed_mutations:
        type: list[string]
        enum_values:
          - source_code
          - test_code
          - workflow_via_cli
          - sldb_via_cli
      workspace_policy:
        type: object
        required_fields:
          - isolation
          - lease_required
        fields:
          isolation:
            type: string
            enum:
              - git_worktree
              - branch
              - container_workspace
              - read_only
          lease_required:
            type: boolean
          branch_prefix:
            type: string
      command_allowlist:
        type: list[string]
        description: Command prefixes allowed for the worker.
        examples:
          - deskops show
          - deskops next
          - deskops advance
          - sldb docs
          - pytest
          - git status
      idempotency_key:
        type: string
        description: Stable key used by adapters to deduplicate retries.
  semantic_execution.completed:
    description: Returned by an adapter after the semantic execution attempt finishes.
    required_fields:
      - event_id
      - event_type
      - request_event_id
      - task_id
      - result
      - changed_files
      - requested_transition
    fields:
      event_id:
        type: string
        description: Unique completion event identifier.
      event_type:
        type: string
        const: semantic_execution.completed
      request_event_id:
        type: string
        description: Event id of the request this completion answers.
      task_id:
        type: string
      result:
        type: string
        enum:
          - success
          - blocked
          - failed
          - cancelled
      changed_files:
        type: list[string]
        description: Files changed inside the isolated workspace.
      notes:
        type: string
        description: Human-readable execution summary, ambiguity notes, or failure triage.
      requested_transition:
        type: string
        enum:
          - none
          - advance_to_testing
          - advance_to_closeout
          - close_task
          - retry_failure_triage
      validation_hint:
        type: list[string]
        description: Suggested local validation commands. Deskops decides what actually runs.
rules:
  - Deskops must validate local state before accepting any requested transition.
  - Adapters must not write desk, .sldb, or structured workflow artifacts directly when a CLI path exists.
  - Parallel mutable work requires isolated workspaces and task or file leases.
  - Duplicate request events with the same idempotency_key must not create duplicate work.
  - Secret-bearing adapter configuration must not be passed into worker prompts or unrestricted subprocess environments.
