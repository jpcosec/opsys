name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/jpcosec/sldb.git@main"
          python -m pip install -e . pytest pytest-asyncio

      - name: Configure git identity for tests that create commits
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build the store from its sources
        # .sldb/core/ is derived and not versioned (sldb docs/architecture/derived-store-boundary.md);
        # .sldb/store.yaml declares it. deskops links no store, and sldb's models come from the
        # installed package.
        run: sldb stores build --store .sldb

      - name: Run tests
        run: python -m pytest tests -q

      - name: Check the store rebuilds from the versioned sources
        run: sldb stores build --check --store .sldb

      - name: Check knowledge integrity
        run: bash scripts/ci-knowledge-check.sh .
