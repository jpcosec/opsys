id: desk-testing-ritual
title: Desk Testing Ritual
type: activity
version: "1.0"
metadata:
  author: OpenCode
  description: Phase-gated testing flow for desk task closure, turning contracts and pill guardrails into explicit proof before closeout.
data:
  start: start
  end: ready_for_closeout
  steps:
    start:
      label: Receive execution-to-testing handoff
      next: confirm_handoff
    confirm_handoff:
      label: Confirm contract, touched surfaces, and bound pills
      next: review_existing_tests
    review_existing_tests:
      label: Check whether existing tests are stale
      next: derive_assertions
    derive_assertions:
      label: Translate pills, especially how_not, into assertions
      next: update_tests
    update_tests:
      label: Add or update tests for the intended contract
      next: run_small_scope
    run_small_scope:
      label: Run smallest relevant test scope first
      next: need_broader_validation
    need_broader_validation:
      label: Does the task change shared behavior?
      kind: decision
      branches:
        "yes": run_broader_validation
        "no": tests_green
    run_broader_validation:
      label: Run broader validation
      next: tests_green
    tests_green:
      label: Are relevant tests and guardrail checks green?
      kind: decision
      branches:
        "yes": ready_for_closeout
        "no": fix_or_retest
    fix_or_retest:
      label: Fix failures or revise stale tests
      next: update_tests
    ready_for_closeout:
      label: Testing gate passed and closeout handoff opened
