vistas:
  - id: deskops-pron-component
    category: Arquitectura
    title: deskops sobre pron - capas
    nav: Componentes
    desc: Las seis capas de deskops reconstruido sobre pron. El CLI emite intenciones, la capa de formas arma s-expressions, y pron resuelve, prevalida, ejecuta, refresca y registra. sldb y kgdb quedan detras de pron.
    src: deskops-pron-component.mmd
    specs:
      - deskops-pron-component.yml
  - id: deskops-pron-sequence
    category: Arquitectura
    title: Un movimiento como forma - bind pill a task
    nav: Secuencia
    desc: Un movimiento completo de deskops expresado como forma. Prevalidacion antes de escribir, un solo refresh del grafo, y un MoveDoc con la forma dicha, la resuelta y el hash del mundo antes y despues.
    src: deskops-pron-sequence.mmd
    specs:
      - deskops-pron-sequence.yml
  - id: deskops-pron-workflow-state
    category: Arquitectura
    title: Ciclo de vida de una task
    nav: Workflow
    desc: La maquina de estados declarativa del workflow de deskops. Cada transicion tiene guarda (ConditionDoc) y efecto (OperatorDoc). Es lo que pron evalua como formas.
    src: deskops-pron-workflow-state.mmd
    specs:
      - deskops-pron-workflow-state.yml
  - id: deskops-pron-primitives
    category: Arquitectura
    title: Primitivas de workflow como documentos
    nav: Workflow
    desc: Conditions, operators, edges, hooks, checklists y routines dejan de ser codigo Python interpretado por deskops y pasan a ser documentos del mundo evaluados por pron.
    src: deskops-pron-primitives.mmd
    specs:
      - deskops-pron-primitives.yml
  - id: deskops-pron-routine-translation
    category: Arquitectura
    title: RoutineDoc traducido al mundo
    nav: Workflow
    desc: Como se traduce RoutineDoc. La routine no es una relacion - es un grafo. Se parte en dos - la maquina de estados (State con machine TaskDoc.status y aristas transitions_to) y el procedimiento (StepDoc ordenados por next_step). El OperatorDoc desaparece porque cambiar el campo ya es el efecto.
    src: deskops-pron-routine-translation.mmd
    specs:
      - deskops-pron-routine-translation.yml
  - id: deskops-pron-taxonomy
    category: Arquitectura
    title: Taxonomia de documentos
    nav: Taxonomia
    desc: Las 23 clases de documento de deskops agrupadas en cinco familias - conocimiento, trabajo, procedimiento, maquinaria y entorno. Las flechas son contencion y referencia declaradas en los modelos.
    src: deskops-pron-taxonomy.mmd
    specs:
      - deskops-pron-taxonomy.yml
  - id: deskops-pron-planning-ast
    category: Arquitectura
    title: Planificacion, AST y git
    nav: Workflow
    desc: El supervisor suelta un planificador que produce un PlanDoc. Cada target del plan apunta a un simbolo del AST, y el cierre transitivo de calls e imports da que codigo revisar y que tests correr. Los commits se resuelven a simbolos por rango de lineas, asi la tarea muestra que cambio, cuando y que se toco.
    src: deskops-pron-planning-ast.mmd
    specs:
      - deskops-pron-planning-ast.yml
