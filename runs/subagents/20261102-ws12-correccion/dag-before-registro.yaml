- id: WS02
  title: Inventariar superficies y operaciones Deskops
  status: candidate
  kind: planning
  depends_on:
  - WS01
  requires: []
  owner_repo: deskops
  output_scope: auditoria/deskops.md
  scope: 'Superficie = cada archivo, comando público o modelo registrado concreto
    de las categorías enumeradas; una fila por superficie. Modelos y Markdown no modelado;
    inbox/drawer/issues/FAQ/crossroads/pills/fases/rituales/registry/roles/runs; firmas
    públicas, efectos Git y cierre. Modelado = tiene modelo registrado en el store
    (`sldb models list`); Markdown no modelado = el resto. Firmas públicas = comandos
    CLI de deskops y métodos de DeskopsOperations. Cierre = `deskops closeout verify|commit`.
    Universo: archivos de categorías enumeradas bajo desk/ de este checkout, comandos
    Deskops y modelos que sirven esas superficies; store local .sldb del checkout.
    Una fila por superficie con lista de todas sus operaciones públicas; no duplicar
    por comando. Para dato pasivo registrar path/hash o listado read-only; falta store
    se informa no comprobado con causa.'
  acceptance: Cada fila incluye ubicación (archivo o símbolo de código) y la operación
    expuesta (comando o método que la lee o muta, o «dato pasivo»), con estado comprobado;
    no inferir modelo por carpeta. Estado comprobado = lectura citada con archivo:línea
    o salida de comando de solo lectura; lo no comprobado se marca «no comprobado»
    con causa (ausente, inaccesible o no encontrado). Una fila contiene lista de operaciones,
    no elegir solo una. La evidencia puede ser archivo:línea, hash/listado read-only
    o salida de comando según soporte; alcance de categorías y store local .sldb,
    sin inventariar binarios ajenos.
  estimate: M
  task_file: desk/drawer/tasks/workspace-documental/task-ws02.md
  promotion: not_authorized; precise changed files/pills/atoms/evidence and task-only
    preflight required
  output_base: deskops:desk/drawer/plans/workspace-documental/
