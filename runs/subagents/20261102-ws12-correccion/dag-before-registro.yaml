  de autoria de ViewDoc/NotationDoc concretos (WS18), sin portabilidad generica ni
  evaluador nuevo; B) glosario de revision en tres conceptos y nuevo productor planificado
  WS45 (sldb, precondicion de escritura de payload, independiente de source_mode)
  con gate G_PAYLOAD_PRECONDITION, consumido por WS19, WS19.1, WS19.2 y WS21; C) captura
  a drawer como canal permitido pendiente de WS12 (comparacion API SLDB / composicion
  / eventual wrapper Deskops); D) WS06 clasifica sin ejecutar WS05, WS32/33 conservan
  dependencias y gates; recibos externos = acta del receptor P01 y WS11/12 como fuente
  de contrato. Nada implementado ni aceptado; execution_authorized=false.'
