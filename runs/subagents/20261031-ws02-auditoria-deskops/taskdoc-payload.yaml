title: 'WS02: Inventariar superficies y operaciones Deskops'
why: Primera capa real del núcleo del plan workspace (cierre.md). Activada por runs/subagents/20261031-ws02-04-checkpoint/activation.md;
  las auditorías alimentan WS06 y WS08-12 con datos comprobados.
goal: Producir desk/drawer/plans/workspace-documental/auditoria/deskops.md como auditoría de solo lectura del estado actual,
  verificable fila por fila.
scope: 'Superficie = cada archivo, comando público o modelo registrado concreto de las categorías enumeradas; una fila por
  superficie. Modelos y Markdown no modelado; inbox/drawer/issues/FAQ/crossroads/pills/fases/rituales/registry/roles/runs;
  firmas públicas, efectos Git y cierre. Modelado = tiene modelo registrado en el store (`sldb models list`); Markdown no
  modelado = el resto. Firmas públicas = comandos CLI de deskops y métodos de DeskopsOperations. Cierre = `deskops closeout
  verify|commit`. Universo: archivos de categorías enumeradas bajo desk/ de este checkout, comandos Deskops y modelos que
  sirven esas superficies; store local .sldb del checkout. Una fila por superficie con lista de todas sus operaciones públicas;
  no duplicar por comando. Para dato pasivo registrar path/hash o listado read-only; falta store se informa no comprobado
  con causa. Solo lectura fuera del entregable. Rutas de lectura: deskops/ (código), desk/ y .sldb de este checkout. Se escribe
  únicamente desk/drawer/plans/workspace-documental/auditoria/deskops.md y evidencia en runs/subagents/20261031-ws02-auditoria-deskops/.
  No se modifica código, otro repo, dag.yaml, reconciliacion.md, Board ajeno ni tareas de otros. Fuera de alcance: WS05 Scion,
  contratos nuevos, implementación.'
implementation_path: '1. Leer fuentes actuales. 2. Escribir desk/drawer/plans/workspace-documental/auditoria/deskops.md: encabezado
  con fecha, commit HEAD de cada repo leído y universo auditado; luego las filas. 3. Registrar comandos usados en runs/subagents/20261031-ws02-auditoria-deskops/commands.log.
  4. Dejar runs/subagents/20261031-ws02-auditoria-deskops/result-summary.md (qué se hizo, huecos, qué revisar). Lo no comprobado
  se marca «no comprobado» con causa: no se infiere. El Executor no hace commits, no escribe en desk/ salvo desk/drawer/plans/workspace-documental/auditoria/deskops.md,
  y no corre closeout.'
done_when: 'Acceptance: Cada fila incluye ubicación (archivo o símbolo de código) y la operación expuesta (comando o método
  que la lee o muta, o «dato pasivo»), con estado comprobado; no inferir modelo por carpeta. Estado comprobado = lectura citada
  con archivo:línea o salida de comando de solo lectura; lo no comprobado se marca «no comprobado» con causa (ausente, inaccesible
  o no encontrado). Una fila contiene lista de operaciones, no elegir solo una. La evidencia puede ser archivo:línea, hash/listado
  read-only o salida de comando según soporte; alcance de categorías y store local .sldb, sin inventariar binarios ajenos.'
validation:
- test -s desk/drawer/plans/workspace-documental/auditoria/deskops.md
- python desk/drawer/plans/workspace-documental/build_plan.py --check
- python desk/drawer/plans/workspace-documental/validate_plan.py --check
- python desk/drawer/plans/workspace-documental/context_review.py status
- Tester independiente muestrea filas contra la fuente citada y deja runs/subagents/20261031-ws02-auditoria-deskops/tester-result-summary.md
task_type: docs
closeout_evidence:
- commit
- document
from_drawer: desk/drawer/tasks/workspace-documental/task-ws02.md
references:
- desk/drawer/plans/workspace-documental/cierre.md
- desk/drawer/plans/workspace-documental/dag.yaml
- desk/drawer/plans/workspace-documental/brief.md
- runs/subagents/20261031-ws02-04-checkpoint/activation.md
- desk/rituals/context-review.md
files:
- desk/drawer/plans/workspace-documental/auditoria/deskops.md
