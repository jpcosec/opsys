title: Cerrar corrección de la revisión 9 del plan workspace
why: 'La revisión root aceptó lo sustantivo y dejó tres cierres: dry-run de agregados, disposición de WS35 y recibos manuales.
  El helper ya está reparado. Fuente: runs/subagents/20261031-cierre-revision9/review-source.md.'
goal: Dar crédito operativo completo a los cinco nodos pendientes, corregir por supersesión WS35 y el conteo de instrucciones,
  y dejar build --check, validate --check y status en verde.
scope: 'Planificación en deskops. Archivos: runs/subagents/20261031-cierre-revision9/ como evidencia, desk/drawer/plans/workspace-documental/dag.yaml
  solo en context_review de los nodos que se repiten y proyecciones generadas, runs/subagents/20261031-correccion-revision9/comparison-ledger.md
  con adenda fechada, runs/subagents/20261031-ajuste-canonico-ws06/promotion-notes.md, disposiciones nuevas e intentos bajo
  runs/subagents/20261031-workspace-context-reviews/context-review/.


  Punto 1. WS13, WS15 y WS33 se repiten con `context_review.py run WS13 WS15 WS33 WS12 WS37 --new-attempt --reason <razón>`,
  ya con instrucción durable. Se conservan los intentos previos. El dry-run de un agregado debe recorrer por sus hijos el
  trabajo, las transferencias y la validación; una reformulación detallada no sustituye al dry-run. Si aparece ambigüedad
  real se resuelve por escrito y solo se invalidan los inputs afectados. Mismo contrato si sigue claro.


  Punto 2. WS35: por supersesión fechada, la clasificación pasa a decisión de presentación pendiente al promover: mostrar
  o excluir mensajes sin intento. Productor: TaskDoc de WS35, con aceptación de ese caso antes de ejecutar. Sin decidir la
  UX de Scion, sin consultar producto y sin cambiar contrato. Deja de estar vigente «no es ambigüedad». La disposición original
  se conserva.


  Punto 3. WS12 y WS37 reciben intentos frescos por el canal reparado, sin cambiar sus briefs. Sus intentos manuales quedan
  como evidencia histórica declarada, con recibo incompleto; no se rellenan.


  Conteo: el ledger afirmó 39 y 34; lo real es 40 con SYSTEM original y 33 con ampliado, según root. Se corrige la afirmación
  del resumen por adenda, sin reescribir evidencia. Los otros 68 outputs no se repiten; el ledger declara qué versión de instrucción
  tiene cada intento vigente.


  Comparación: el coordinador lee contrato completo, incluidos depends_on, requires y output_scope, output y disposición de
  los cinco nodos, y firma lo que leyó. Una disposición nueva no prueba que la anterior se haya leído.


  Integridad: comprobar los 73 con excepciones históricas explícitas y ninguna vigente oculta, y que ningún intento registrado
  tenga recibo incompleto.


  Roles: el Supervisor ejecuta todo lo anterior. Tester independiente de solo lectura. Fuera de alcance: WS07, WS08-12, código
  de producto, Scion, push, decisiones de producto, reabrir correcciones aceptadas, y revisar los otros 68. Se preservan cuatro
  rutas sucias ajenas.'
implementation_path: 1. Adenda documental y WS35, commit. 2. Revisiones de los cinco. 3. Comparar, disposiciones, registrar.
  4. Integridad y checks. 5. Tester. 6. Closeout, cierre de fase y handoff.
done_when: Los cinco nodos tienen intento fresco con recibo completo y dry-run sustantivo; WS35 reclasificado; conteo corregido;
  build --check, validate --check y status en verde; Tester independiente da PASS.
validation:
- python desk/drawer/plans/workspace-documental/build_plan.py --check
- python desk/drawer/plans/workspace-documental/validate_plan.py --check
- python desk/drawer/plans/workspace-documental/context_review.py status
- python -m pytest -q tests/test_context_review_helper.py
- Tester independiente de solo lectura deja runs/subagents/20261031-cierre-revision9/tester-result-summary.md
task_type: docs
closeout_evidence:
- commit
- document
from_drawer: desk/drawer/tasks/task-cerrar-correccion-revision-9.md
references:
- runs/subagents/20261031-cierre-revision9/review-source.md
- runs/subagents/20261031-correccion-revision9/comparison-ledger.md
- desk/drawer/plans/workspace-documental/dag.yaml
- desk/rituals/context-review.md
files:
