  title: Inventariar superficies y operaciones Deskops
  status: candidate
  kind: planning
  depends_on:
  - WS01
  requires: []
  owner_repo: deskops
  output_scope: auditoria/deskops.md
  scope: Superficie = cada archivo, comando público o modelo registrado concreto de
    las categorías enumeradas; una fila por superficie. Modelos y Markdown no modelado;
    inbox/drawer/issues/FAQ/crossroads/pills/fases/rituales/registry/roles/runs; firmas
    públicas, efectos Git y cierre. Modelado = tiene modelo registrado en el store
    (`sldb models list`); Markdown no modelado = el resto. Firmas públicas = comandos
    CLI de deskops y métodos de DeskopsOperations. Cierre = `deskops closeout verify|commit`.
  acceptance: Cada fila incluye ubicación (archivo o símbolo de código) y operación
    expuesta, con estado comprobado; no inferir modelo por carpeta. Estado comprobado
    = lectura citada con archivo:línea o salida de comando de solo lectura; lo no
    comprobado se marca «no comprobado» con causa (ausente, inaccesible o no encontrado).
  estimate: M
  task_file: desk/drawer/tasks/workspace-documental/task-ws02.md
  promotion: not_authorized; precise changed files/pills/atoms/evidence and task-only
    preflight required
  output_base: deskops:desk/drawer/plans/workspace-documental/
