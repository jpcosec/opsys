title: 'WS08: Precisar user-flows y criterios observables'
why: La revisión root aprobó WS07 y autorizó la capa WS08/WS10. user-flows.md es un
  borrador de intención sin mapa a operaciones, errores, nodos ni gates.
goal: Completar desk/drawer/plans/workspace-documental/borradores/user-flows.md para
  que UF01-UF10 tengan entrada, salida, operación, error, nodo y gate humano, con
  operaciones citadas de las auditorías WS02-WS04 y huecos marcados.
scope: 'Mapear UF a operaciones de WS02/03/04; cubrir manual, captura, revisión, cambios
  (UF07/WS29), arranque, multidesk, schemas y modo degradado (UF07, fallo de backend/dependencia).
  UF02 responder significa dentro del desk/contexto autorizado local; ack local: operación
  pendiente de confirmar en el contrato WS12; no se da por disponible. UF08 es lectura;
  envío interdesk fuera de baseline, sin excepción implícita a P07. Las operaciones
  vienen de auditoria/{deskops,infraestructura,ui}.md, disponibles por dependencia
  transitiva vía WS06/WS07.


  Fijado para esta tarea: conservar los textos UF01-UF10 y las precisiones; añadir
  bajo cada UF una tabla o lista con entrada, salida, operación, error, nodo y gate
  humano. Operación = lista completa con cita a auditoria/*.md. «Manual» en el alcance
  es la operación manual cubierta por las UF, no un entregable de manual. Si falta
  una operación: escribir «hueco» con repo dueño y productor, y en error «no definido»
  con productor, sin inventar. Gate humano = WS16, WS30, WS37 o WS39, o «ninguno adicional»;
  WS29 se anota como prueba técnica propia.


  Autorización acotada: revisión root 2026-11-01, runs/subagents/20261031-atribucion-decisiones/root-approval-20261101.md.
  execution_authorized global sigue false. Reutilizar antes de editar: el texto existente
  no se borra ni se reescribe por estilo.


  Independencia: este nodo no tiene arista con WS10 y no lee ni cita su entregable.
  WS07 está efectiva (runs/subagents/20261031-atribucion-decisiones/ws07-cobertura-efectiva.md).
  G_PRODUCT satisfecho es base de plan, no aceptación de producto, API ni UI. No reabrir
  decisiones P01-P09 ni preguntar al solicitante. Una capacidad se afirma solo con
  cita a auditoría; lo no auditado queda como hueco con dueño. Taller es corpus futuro
  de WS40, no producto operativo.


  Roles: el Executor escribe solo desk/drawer/plans/workspace-documental/borradores/user-flows.md
  y runs/subagents/20261101-ws08-user-flows/result-summary.md. El Supervisor corre
  validaciones, commits, revisiones y closeout. Tester independiente de solo lectura.
  Fuera de alcance: WS09, WS11, WS12, código UI, Scion, push, dag.yaml, validadores,
  helper y la suite general.'
implementation_path: 1. Leer desk/drawer/plans/workspace-documental/borradores/user-flows.md,
  validacion-humana.md, cobertura.md, decisiones.md y las auditorías. 2. Por cada
  UF, verificar qué ya está y añadir lo que falte. 3. Marcar huecos con dueño. 4.
  Escribir runs/subagents/20261101-ws08-user-flows/result-summary.md con las citas
  y el estado de reuso.
done_when: 'Acceptance: Cada UF tiene entrada/salida, operación, error, nodo y gate
  humano; no prometer función fuera de alcance. Nodo = ID del DAG. Una operación ausente
  se marca hueco, sin inventarla. Cubrir todas UF01–UF10; operación/nodo/gate admiten
  listas completas, no elegir nodo principal. Distinguir gate humano WS16/30/37/39
  de prueba técnica propia WS29; si no hay gate humano adicional escribir ninguno
  adicional. Delegación se documenta condicionada a G_SCION/G_EXEC, sin habilitarla.
  Revisiones afectadas renovadas, build --check, validate --check y status en verde,
  y Tester independiente PASS antes del closeout.'
validation:
- grep -c "^## UF" desk/drawer/plans/workspace-documental/borradores/user-flows.md
- python desk/drawer/plans/workspace-documental/build_plan.py --check
- python desk/drawer/plans/workspace-documental/validate_plan.py --check
- python desk/drawer/plans/workspace-documental/context_review.py status
- Tester independiente de solo lectura deja runs/subagents/20261101-ws08-user-flows/tester-result-summary.md
task_type: docs
closeout_evidence:
